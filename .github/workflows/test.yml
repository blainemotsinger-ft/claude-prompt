name: test

# On every pull request, and on every push to main, which includes merging a pull request
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, perl ${{ matrix.perl }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Finish every combination, so one failure doesn't hide another
      fail-fast: false
      matrix:
        include:
          # The perl that comes with the system, which is what most people will run it with
          - os: ubuntu-latest
            perl: system

          # Turned off for now: GitHub often has no macOS runner free, and the job waits
          # 15 minutes, never runs, and fails the check ("not acquired by Runner").
          # - os: macos-latest
          #   perl: system

          # The oldest perl the README says it works with
          - os: ubuntu-latest
            perl: '5.14'

    steps:
      - uses: actions/checkout@v4

      - if: matrix.perl != 'system'
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}

      - name: Show versions
        run: |
          perl -v | sed -n 2p
          git --version
          bash --version | head -1

      - name: Run tests
        run: prove -v t/
